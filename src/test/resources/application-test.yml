spring:
  ai:
    model:
      chat: none
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:mem:jobtracker_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: true
  sql:
    init:
      mode: always

jwt:
  secret: TestSecretKeyThatIsAtLeast256BitsLongForTestingPurposesOnly123456
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 604800000

app:
  export:
    # Tests trigger executions explicitly; the poller stays off so runs are deterministic.
    scheduler-enabled: false
    default-timezone: America/Sao_Paulo
  api:
    base-url: https://jobapply-api.hugojava.dev
  frontend:
    reset-password-url: http://localhost:5173/reset-password
  security:
    password-reset-token-expiration-hours: 24
  mail:
    enabled: false
  google-drive:
    client-id: test-google-client-id
    client-secret: test-google-client-secret
    redirect-uri: http://localhost:8080/api/v1/google-drive/oauth/callback
    oauth-complete-url: http://localhost:5173/settings/google-drive/callback
  gpt-oauth:
    client-id: test-openai-client-id
    client-secret: test-openai-client-secret
    redirect-uris: https://chat.openai.com/aip/test/callback
    scopes: read:profile,read:applications,write:applications,read:resume,read:google-drive,read:metrics,openid
    issuer: https://jobapply-api.hugojava.dev
    authorization-code-expiration-seconds: 300
    access-token-expiration-seconds: 900
    refresh-token-expiration-seconds: 2592000
  gpt-fallback-auth:
    enabled: false
    token: ""
  webauthn:
    rp-id: localhost
    rp-name: JobApplyTracker Test
    origins:
      - http://localhost:3000
      - http://localhost:5173
    challenge-timeout-seconds: 300

cors:
  allowed-origins: http://localhost:3000

management:
  tracing:
    sampling:
      probability: 0.0

logging:
  level:
    root: WARN
    com.jobtracker: INFO

resilience4j:
  ratelimiter:
    instances:
      authRegister:
        limit-for-period: 1000
        limit-refresh-period: 1m
        timeout-duration: 0
      authLogin:
        limit-for-period: 1000
        limit-refresh-period: 1m
        timeout-duration: 0
      authRefresh:
        limit-for-period: 1000
        limit-refresh-period: 1m
        timeout-duration: 0
      authForgotPassword:
        limit-for-period: 1000
        limit-refresh-period: 1m
        timeout-duration: 0
      authResetPassword:
        limit-for-period: 1000
        limit-refresh-period: 1m
        timeout-duration: 0
      authLogout:
        limit-for-period: 1000
        limit-refresh-period: 1m
        timeout-duration: 0
      formLogin:
        limit-for-period: 1000
        limit-refresh-period: 1m
        timeout-duration: 0
      exportManual:
        limit-for-period: 1000
        limit-refresh-period: 1m
        timeout-duration: 0
