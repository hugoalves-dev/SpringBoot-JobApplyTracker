spring:
  config:
    import: optional:file:.env[.properties]
  activate:
    on-profile: prod
  ai:
    model:
      chat: ${APP_ASSISTANT_PROVIDER:none}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: ${GEMINI_CHAT_MODEL:gemini-2.5-flash}
            thinking-budget: ${GEMINI_THINKING_BUDGET:0}
            thinking-level: ${GEMINI_THINKING_LEVEL:}
    mcp:
      server:
        enabled: true
        name: job-tracker-mcp
        version: 1.0.0
        instructions: >
          Job Apply Tracker owns the complete resume/CV workflow for job applications.
          Every job-related resume request MUST be routed through this server's resume tools
          (Generate-Application-Resume, or the low-level List-Base-Resumes /
          Detect-Resume-Placeholders / Generate-Resume / Copy-Resume-To-Application sequence).
          Never fall back to generic document, filesystem, Python, DOCX, PDF, or non-MCP Google
          Drive tools to produce or edit a resume, including as a silent fallback when a tool
          call fails — surface the failure and retry instead. A resume request is complete only
          once this server returns a Google Doc (documentUrl) and PDF (pdfUrl) linked to the
          application. See resource://job-apply-tracker/resume-workflow-rules for the full workflow.
          Application status and archival are independent concepts. Rejected or Approved status
          changes MUST NOT archive an application. Never infer archival from a terminal status or
          rejection message; apply the least destructive mutation and archive only from explicit
          or clearly established archive intent. See
          resource://job-apply-tracker/application-lifecycle-rules for the full lifecycle policy.
        # Claude.ai (and other modern MCP connectors) speak the Streamable HTTP
        # transport: a single endpoint that handles both POST (JSON-RPC) and GET
        # (SSE stream). Requires Spring AI 2.0+. The endpoint defaults to /mcp,
        # which is already covered by SecurityConfig's /mcp/** rule and the
        # OAuth protected-resource metadata controller.
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp
  threads:
    virtual:
      enabled: true
  jmx:
    enabled: false
  jackson:
    default-property-inclusion: non_null
  application:
    name: job-tracker
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/jobtracker?createDatabaseIfNotExist=true&characterEncoding=UTF-8&useUnicode=true}
    username: ${DB_USERNAME:jobtracker}
    password: ${DB_PASSWORD:jobtracker}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        type.preferred_uuid_jdbc_type: BINARY
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.from: ${MAIL_FROM:no-reply@example.com}
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          ssl:
            enable: ${MAIL_SMTP_SSL:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      max: 50
  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET:ThisIsAVeryLongSecretKeyForJWTTokensAndItMustBeAtLeast256BitsLong}
  access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
  refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://applywell.hugojava.dev}

app:
  logging:
    jobtracker-level: ${JOBTRACKER_LOG_LEVEL:DEBUG}
  assistant:
    enabled: ${APP_ASSISTANT_ENABLED:false}
    max-message-length: ${APP_ASSISTANT_MAX_MESSAGE_LENGTH:4000}
    default-search-results: ${APP_ASSISTANT_DEFAULT_SEARCH_RESULTS:10}
    max-search-results: ${APP_ASSISTANT_MAX_SEARCH_RESULTS:20}
    stream-timeout: ${APP_ASSISTANT_STREAM_TIMEOUT:60s}
  api:
    base-url: ${APP_API_BASE_URL:https://jobapply-api.hugojava.dev}
  frontend:
    reset-password-url: ${APP_FRONTEND_RESET_PASSWORD_URL:https://your-frontend.com/reset-password}
  security:
    password-reset-token-expiration-hours: ${PASSWORD_RESET_TOKEN_EXPIRATION_HOURS:24}
  mail:
    enabled: ${APP_MAIL_ENABLED:true}
    from: ${APP_MAIL_FROM:no-reply@jobtracker.com}
  github:
    # Stable numeric user ID of the GitHub account shown in Developer Tools -> Source Code.
    # This is the canonical identity of the integration: usernames can be renamed, IDs cannot.
    user-id: ${GITHUB_USER_ID:65777252}
    # Legacy/bootstrap username. Only used when no user ID is configured (resolved once to an ID)
    # or as a presentation fallback while the GitHub API is unreachable.
    login: ${GITHUB_LOGIN:}
    api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
    # Optional PAT. Unauthenticated requests are enough here, it only raises the rate limit.
    token: ${GITHUB_TOKEN:}
    cache-ttl-seconds: ${GITHUB_CACHE_TTL_SECONDS:3600}
    timeout-ms: ${GITHUB_TIMEOUT_MS:5000}
  google-drive:
    client-id: ${GOOGLE_DRIVE_CLIENT_ID:}
    client-secret: ${GOOGLE_DRIVE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_DRIVE_REDIRECT_URI:http://localhost:8080/api/v1/google-drive/oauth/callback}
    oauth-complete-url: ${GOOGLE_DRIVE_OAUTH_COMPLETE_URL:}
    authorization-uri: ${GOOGLE_DRIVE_AUTHORIZATION_URI:https://accounts.google.com/o/oauth2/v2/auth}
    token-uri: ${GOOGLE_DRIVE_TOKEN_URI:https://oauth2.googleapis.com/token}
    scopes: ${GOOGLE_DRIVE_SCOPES:https://www.googleapis.com/auth/drive,https://www.googleapis.com/auth/documents.readonly}
  gpt-oauth:
    client-id: ${OPENAI_GPT_CLIENT_ID:}
    client-secret: ${OPENAI_GPT_CLIENT_SECRET:}
    redirect-uris: ${OPENAI_GPT_REDIRECT_URIS:}
    scopes: ${OPENAI_GPT_SCOPES:openid,read:profile,read:applications,write:applications,read:resume,read:google-drive,read:metrics}
    issuer: ${OPENAI_GPT_ISSUER:${app.api.base-url}}
    authorization-code-expiration-seconds: ${OPENAI_GPT_AUTHORIZATION_CODE_EXPIRATION_SECONDS:300}
    access-token-expiration-seconds: ${OPENAI_GPT_ACCESS_TOKEN_EXPIRATION_SECONDS:900}
    refresh-token-expiration-seconds: ${OPENAI_GPT_REFRESH_TOKEN_EXPIRATION_SECONDS:2592000}
  gpt-fallback-auth:
    enabled: ${GPT_FALLBACK_AUTH_ENABLED:false}
    token: ${GPT_FALLBACK_AUTH_TOKEN:}
  mcp-oauth:
    client-id: ${MCP_CLIENT_ID:}
    client-secret: ${MCP_CLIENT_SECRET:}
    redirect-uris: ${MCP_REDIRECT_URIS:}
    scopes: ${MCP_SCOPES:openid,read:profile,read:applications,write:applications,read:resume,read:google-drive,read:metrics}
    access-token-expiration-seconds: ${MCP_ACCESS_TOKEN_EXPIRATION_SECONDS:900}
    refresh-token-expiration-seconds: ${MCP_REFRESH_TOKEN_EXPIRATION_SECONDS:2592000}
  export:
    max-records: ${APP_EXPORT_MAX_RECORDS:10000}
    page-size: ${APP_EXPORT_PAGE_SIZE:500}
    default-timezone: ${APP_EXPORT_DEFAULT_TIMEZONE:America/Sao_Paulo}
    max-schedules-per-user: ${APP_EXPORT_MAX_SCHEDULES_PER_USER:10}
    scheduler-enabled: ${APP_EXPORT_SCHEDULER_ENABLED:true}
    scheduler-interval-ms: ${APP_EXPORT_SCHEDULER_INTERVAL_MS:60000}
    lock-timeout-minutes: ${APP_EXPORT_LOCK_TIMEOUT_MINUTES:30}
    drive-folder-name: ${APP_EXPORT_DRIVE_FOLDER_NAME:Applywell Exports}
  webauthn:
    rp-id: ${APP_WEBAUTHN_RP_ID:applywell.hugojava.dev}
    rp-name: ${APP_WEBAUTHN_RP_NAME:ApplyWell}
    origins:
      - ${APP_WEBAUTHN_ORIGIN_1:https://applywell.hugojava.dev}
    challenge-timeout-seconds: ${APP_WEBAUTHN_CHALLENGE_TIMEOUT_SECONDS:300}

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
    jmx:
      exposure:
        exclude: '*'
  endpoint:
    health:
      show-details: when_authorized
      group:
        uptime:
          include: "*"
          additional-path: "server:/health"
          show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

resilience4j:
  ratelimiter:
    instances:
      authRegister:
        limit-for-period: ${RATE_LIMIT_AUTH_REGISTER_LIMIT_FOR_PERIOD:5}
        limit-refresh-period: ${RATE_LIMIT_AUTH_REGISTER_REFRESH_PERIOD:1m}
        timeout-duration: ${RATE_LIMIT_AUTH_REGISTER_TIMEOUT_DURATION:0}
      authLogin:
        limit-for-period: ${RATE_LIMIT_AUTH_LOGIN_LIMIT_FOR_PERIOD:10}
        limit-refresh-period: ${RATE_LIMIT_AUTH_LOGIN_REFRESH_PERIOD:1m}
        timeout-duration: ${RATE_LIMIT_AUTH_LOGIN_TIMEOUT_DURATION:0}
      authRefresh:
        limit-for-period: ${RATE_LIMIT_AUTH_REFRESH_LIMIT_FOR_PERIOD:20}
        limit-refresh-period: ${RATE_LIMIT_AUTH_REFRESH_REFRESH_PERIOD:1m}
        timeout-duration: ${RATE_LIMIT_AUTH_REFRESH_TIMEOUT_DURATION:0}
      authForgotPassword:
        limit-for-period: ${RATE_LIMIT_AUTH_FORGOT_PASSWORD_LIMIT_FOR_PERIOD:3}
        limit-refresh-period: ${RATE_LIMIT_AUTH_FORGOT_PASSWORD_REFRESH_PERIOD:1m}
        timeout-duration: ${RATE_LIMIT_AUTH_FORGOT_PASSWORD_TIMEOUT_DURATION:0}
      authResetPassword:
        limit-for-period: ${RATE_LIMIT_AUTH_RESET_PASSWORD_LIMIT_FOR_PERIOD:5}
        limit-refresh-period: ${RATE_LIMIT_AUTH_RESET_PASSWORD_REFRESH_PERIOD:1m}
        timeout-duration: ${RATE_LIMIT_AUTH_RESET_PASSWORD_TIMEOUT_DURATION:0}
      authLogout:
        limit-for-period: ${RATE_LIMIT_AUTH_LOGOUT_LIMIT_FOR_PERIOD:20}
        limit-refresh-period: ${RATE_LIMIT_AUTH_LOGOUT_REFRESH_PERIOD:1m}
        timeout-duration: ${RATE_LIMIT_AUTH_LOGOUT_TIMEOUT_DURATION:0}
      formLogin:
        limit-for-period: ${RATE_LIMIT_FORM_LOGIN_LIMIT_FOR_PERIOD:10}
        limit-refresh-period: ${RATE_LIMIT_FORM_LOGIN_REFRESH_PERIOD:1m}
        timeout-duration: ${RATE_LIMIT_FORM_LOGIN_TIMEOUT_DURATION:0}
      exportManual:
        limit-for-period: ${RATE_LIMIT_EXPORT_MANUAL_LIMIT_FOR_PERIOD:10}
        limit-refresh-period: ${RATE_LIMIT_EXPORT_MANUAL_REFRESH_PERIOD:1m}
        timeout-duration: ${RATE_LIMIT_EXPORT_MANUAL_TIMEOUT_DURATION:0}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  group-configs:
    - group: auth
      display-name: Auth API
      paths-to-match: /api/v1/auth/**
    - group: dashboard
      display-name: Dashboard API
      paths-to-match: /api/v1/dashboard/**
    - group: gamification
      display-name: Gamification API
      paths-to-match: /api/v1/gamification/**
    - group: exports
      display-name: Exports API
      paths-to-match: /api/v1/exports/**, /api/v1/export-schedules/**
    - group: assistant
      display-name: Ask ApplyWell API
      paths-to-match: /api/v1/assistant/**
